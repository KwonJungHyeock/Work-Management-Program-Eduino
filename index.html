<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · Eduino Works</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<div id="intro" class="intro">
  <div class="intro-mark"><span class="bar"></span><span class="nm">Eduino <b>Works</b></span></div>
  <div class="intro-sub">사내 통합 업무관리</div>
  <div class="intro-tip">화면을 클릭하면 시작합니다</div>
</div>

<div class="auth">
  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-brand"><div class="mk"></div><div class="nm">Eduino <span>Works</span></div>
        <div class="tag">사내 업무관리</div></div>
      <div class="auth-steps"><div class="st on" id="st1"></div><div class="st" id="st2"></div></div>
      <div class="auth-title" id="aTitle">사내 접속코드 입력</div>
      <div class="auth-desc" id="aDesc">회사에서 공유한 10자리 접속코드를 입력하세요.</div>
    </div>
    <div class="auth-body">
      <!-- Step 1: 접속코드 -->
      <form id="step1">
        <label class="fld" style="margin-bottom:4px">접속코드
          <input type="password" id="code" class="code-in" maxlength="10" placeholder="••••••••••" autocomplete="off" autofocus></label>
        <div class="auth-err" id="err1"></div>
        <button type="submit" class="btn pri lg block">확인</button>
      </form>
      <!-- Step 2: 기기 이름 -->
      <form id="step2" class="hidden">
        <label class="fld" style="margin-bottom:4px">이 PC의 기기 이름
          <input type="text" id="dev" maxlength="24" placeholder="예: MD-PC-01" autocomplete="off"></label>
        <div class="auth-desc" style="margin:2px 0 6px">브라우저는 실제 PC 이름을 읽을 수 없어, 이 PC를 구분할 이름을 한 번만 정합니다. (이 PC에 저장됩니다)</div>
        <div class="dev-suggest" id="devSuggest"></div>
        <div class="auth-err" id="err2"></div>
        <button type="submit" class="btn pri lg block" style="margin-top:10px">시작하기</button>
      </form>
    </div>
    <div class="auth-foot">
      <b>초안(Draft) 안내</b> — 현재 DB 없이 브라우저에서 동작합니다. 초기 접속코드는 <code>robodyne12</code> 입니다.
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // 인트로 스플래시 (클릭 또는 자동으로 사라짐)
  (function(){ const intro=$('intro'); if(!intro) return;
    const hide=()=>intro.classList.add('gone');
    intro.addEventListener('click',hide); setTimeout(hide,2200);
  })();

  if(Auth.current() && Auth.device()) location.href='app.html';

  const goStep2=()=>{
    $('step1').classList.add('hidden'); $('step2').classList.remove('hidden');
    $('st2').classList.add('on'); $('aTitle').textContent='기기 이름 설정';
    $('aDesc').textContent='이 PC를 구분할 이름을 정하면 접속 화면에 표시됩니다.';
    const pre=Auth.device(); if(pre) $('dev').value=pre;
    $('dev').focus();
    const sug=['MD-PC-01','CS-PC-01','경리-PC','디자인-PC','대표-노트북'];
    $('devSuggest').innerHTML=sug.map(s=>`<span class="pill">${s}</span>`).join('');
    $('devSuggest').querySelectorAll('.pill').forEach(p=>p.onclick=()=>{ $('dev').value=p.textContent; });
  };

  $('step1').addEventListener('submit',e=>{
    e.preventDefault();
    const code=$('code').value.trim();
    if(code.length!==10){ $('err1').textContent='접속코드는 10자리입니다.'; return; }
    if(code!==ACCESS_CODE){ $('err1').textContent='접속코드가 올바르지 않습니다.'; $('code').select(); return; }
    $('err1').textContent='';
    if(Auth.device()){ Auth.login(code); location.href='app.html'; }
    else goStep2();
  });

  $('step2').addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('dev').value.trim();
    if(name.length<2){ $('err2').textContent='기기 이름을 2자 이상 입력하세요.'; return; }
    Auth.setDevice(name); Auth.login($('code').value.trim());
    location.href='app.html';
  });
</script>
</body>
</html>
