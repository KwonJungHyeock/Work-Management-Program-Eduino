<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 에듀이노 통합 업무관리</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<div id="intro" class="intro">
  <div class="intro-mark"><img class="intro-logo" src="assets/brand/eduino-mark.svg" alt="에듀이노"><span class="nm">에듀이노</span></div>
  <div class="intro-sub">통합 업무관리 프로그램</div>
  <div class="intro-tip">화면을 클릭하면 시작합니다</div>
</div>

<div class="auth">
  <div class="auth-card">
    <div class="auth-hero">
      <img class="hero-logo" src="assets/brand/eduino-mark.svg" alt="에듀이노">
      <div class="hero-nm">에듀이노</div>
      <div class="hero-tag">통합 업무관리 프로그램</div>
      <ul class="hero-points">
        <li><span class="dot"></span>CS · MD 업무를 한 곳에서</li>
        <li><span class="dot"></span>팀 설정·접속 현황 실시간 공유</li>
        <li><span class="dot"></span>관리자 계정 발급·권한 관리</li>
      </ul>
      <div class="hero-desc">사내 전용 시스템입니다. 계정은 관리자(팀장)가 발급합니다.</div>
    </div>
    <div class="auth-panel">
      <div class="auth-title">로그인</div>
      <div class="auth-desc">관리자에게 발급받은 아이디와 접속코드를 입력하세요.</div>
      <form id="loginForm">
        <label class="fld">아이디
          <input type="text" id="loginId" placeholder="예: cs.kim" autocomplete="username" autofocus></label>
        <label class="fld">접속코드
          <input type="password" id="code" class="code-in" placeholder="••••••••" autocomplete="current-password"></label>
        <div class="auth-err" id="err1"></div>
        <button type="submit" class="btn pri lg block" id="loginBtn">로그인</button>
      </form>
      <div class="auth-foot">
        팀장(관리자)은 <b>관리자 계정</b>으로 로그인해 팀원 계정과 권한을 발급할 수 있습니다.
      </div>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // 인트로 스플래시 (클릭 또는 자동으로 사라짐)
  (function(){ const intro=$('intro'); if(!intro) return;
    const hide=()=>intro.classList.add('gone');
    intro.addEventListener('click',hide); setTimeout(hide,2200);
  })();

  if(Auth.current() && Auth.user()) location.href='app.html';

  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const loginId=$('loginId').value.trim(), code=$('code').value.trim();
    const btn=$('loginBtn'), err=$('err1');
    if(!loginId || !code){ err.textContent='아이디와 접속코드를 입력하세요.'; return; }
    err.textContent=''; btn.disabled=true; btn.textContent='확인 중…';
    const r=await Auth.login(loginId, code);
    if(r.ok){ location.href='app.html'; return; }
    err.textContent=r.error||'로그인에 실패했습니다.'; btn.disabled=false; btn.textContent='로그인'; $('code').select();
  });
</script>
</body>
</html>
